
version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: football_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  pipeline:
    build: .
    container_name: football_pipeline
    depends_on:
      - postgres
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    command: ["python", "src/main.py"]
  
  backend:
    build: ./backend
    container_name: football_backend
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: football_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
